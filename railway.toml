[build]
builder = "nixpacks"

[deploy]
startCommand = "sh -c 'streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 30
