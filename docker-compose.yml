version: "3.9"

services:
  screener:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Persist the data cache across container restarts
      - screener_cache:/app/.cache
    environment:
      - CACHE_DIR=/app/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  screener_cache:
